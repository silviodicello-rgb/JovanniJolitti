<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escape room · L'età giolittiana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3ead7; --paper2:#eadcbf; --ink:#2a2118; --muted:#6b5c48;
  --red:#9c2f22; --green:#2f5d46; --gold:#b08a3e; --line:#cdb994;
  --ok:#2f6d3f; --bad:#a3352a;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:"Source Serif 4",Georgia,serif; color:var(--ink); font-size:18px; line-height:1.5;
  background:#3b2f24 radial-gradient(ellipse at top,#4a3b2d 0%,#2b221a 70%) fixed;
  min-height:100vh; padding:16px;
}
.wrap{max-width:820px;margin:0 auto}
.card{
  background:var(--paper); border-radius:6px; padding:28px 30px;
  box-shadow:0 10px 40px rgba(0,0,0,.45), inset 0 0 80px rgba(160,120,60,.18);
  border:1px solid #d8c7a2; position:relative;
}
.card:before{content:"";position:absolute;inset:8px;border:1px solid var(--line);border-radius:3px;pointer-events:none}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;margin:0 0 .4em;line-height:1.15}
h1{font-size:2.3rem;font-weight:800;color:var(--red)}
h2{font-size:1.6rem;color:var(--green)}
.kicker{font-variant:small-caps;letter-spacing:.12em;color:var(--muted);font-size:.9rem;margin-bottom:.3em}
.orn{text-align:center;color:var(--gold);letter-spacing:.6em;margin:10px 0 14px}
p{margin:.5em 0}
button{
  font-family:inherit;font-size:1rem;cursor:pointer;border-radius:4px;
  border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:10px 18px;
}
button:hover{filter:brightness(1.15)}
button.ghost{background:transparent;color:var(--ink)}
button:disabled{opacity:.45;cursor:default;filter:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.right{justify-content:flex-end}

/* HUD */
.hud{
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  color:var(--paper);margin-bottom:12px;font-size:.95rem
}
.timer{font-family:"Playfair Display",serif;font-size:1.7rem;font-weight:800;letter-spacing:.04em;min-width:92px}
.timer.warn{color:#f0b35a}.timer.crit{color:#ff7a66;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.5}}
.doors{display:flex;gap:6px}
.door{
  width:30px;height:38px;border-radius:14px 14px 2px 2px;border:1px solid #a88d5f;
  display:grid;place-items:center;font-family:"Playfair Display",serif;font-weight:800;font-size:.95rem;
  background:#5a4734;color:#d9c49b
}
.door.open{background:var(--gold);color:var(--ink);border-color:#e3c98a}
.door.here{outline:2px solid #f3ead7;outline-offset:2px}
.score{opacity:.9}
.penalty{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--bad);color:#fff;
  padding:6px 14px;border-radius:20px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.penalty.show{opacity:1}

/* Question */
.qmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin-bottom:6px}
.qtext{font-size:1.15rem;font-weight:600;margin:6px 0 14px}
.opts{display:grid;gap:8px}
.opt{
  text-align:left;background:var(--paper2);color:var(--ink);border:1px solid var(--line);padding:12px 14px;
}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.wrong{background:#ecc9c0;border-color:var(--bad);text-decoration:line-through}
.opt.right{background:#cfe2c8;border-color:var(--ok)}
input[type=text]{
  font-family:inherit;font-size:1.1rem;padding:10px 12px;border:1px solid var(--muted);border-radius:4px;
  background:#fffaf0;width:100%;max-width:420px;color:var(--ink)
}
.cls{display:grid;gap:8px}
.clsrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--paper2)}
.clsrow.wrong{border-color:var(--bad);background:#efd3cb}
.clsrow.right{border-color:var(--ok);background:#d6e6cf}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{padding:6px 10px;font-size:.9rem;background:transparent;color:var(--ink);border-color:var(--muted)}
.seg button.sel{background:var(--green);color:#fff;border-color:var(--green)}
.ord{display:grid;gap:6px}
.orow{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--paper2)}
.orow .n{font-family:"Playfair Display",serif;font-weight:800;color:var(--red);width:22px}
.orow .t{flex:1}
.orow button{padding:4px 10px;background:transparent;color:var(--ink);border-color:var(--muted)}
.orow.wrong{border-color:var(--bad);background:#efd3cb}
.orow.right{border-color:var(--ok);background:#d6e6cf}
.fb{margin-top:16px;padding:12px 14px;border-left:4px solid var(--gold);background:#efe3c8;border-radius:0 4px 4px 0}
.fb.ok{border-color:var(--ok)}.fb.bad{border-color:var(--bad)}
.fb b{font-family:"Playfair Display",serif}
.actions{margin-top:18px}

/* Room intro / letter */
.bigletter{
  font-family:"Playfair Display",serif;font-size:4.5rem;font-weight:800;color:var(--red);
  width:110px;height:130px;margin:10px auto;display:grid;place-items:center;
  border:2px solid var(--gold);border-radius:50px 50px 4px 4px;background:var(--paper2)
}
.center{text-align:center}
.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.tile{width:44px;height:52px;display:grid;place-items:center;font-family:"Playfair Display",serif;font-weight:800;
  font-size:1.6rem;background:var(--paper2);border:1px solid var(--gold);border-radius:4px;color:var(--red)}
.review{margin-top:18px}
.review details{border-top:1px solid var(--line);padding:8px 0}
.review summary{cursor:pointer;font-weight:600}
.rq{margin:8px 0 12px;font-size:.95rem}
.rq .a{color:var(--green);font-weight:600}
.tag{display:inline-block;font-size:.8rem;padding:1px 8px;border-radius:10px;margin-left:6px;vertical-align:middle}
.tag.t10{background:#cfe2c8}.tag.t5{background:#efe0b5}.tag.t0{background:#ecc9c0}
select{font-family:inherit;font-size:1rem;padding:8px;border-radius:4px;border:1px solid var(--muted);background:#fffaf0}
.small{font-size:.9rem;color:var(--muted)}
@media (max-width:560px){
  body{padding:8px;font-size:17px}.card{padding:22px 18px}h1{font-size:1.8rem}
  .door{width:24px;height:32px;font-size:.8rem}.timer{font-size:1.4rem}
}
</style>
</head>

];
const FINAL = {answer:["salandra","antonio salandra"],
  q:"Nel 1914, dopo la guerra di Libia e la crisi economica, Giolitti si dimise e indicò come successore un uomo politico conservatore, che poi non seguì la sua linea e fece reprimere con l'esercito la «settimana rossa». Ricomponi il suo cognome con le lettere che hai raccolto.",
  exp:"Antonio Salandra. La crisi di inizio 1914, la «settimana rossa» in Romagna e nelle Marche e poi la Prima guerra mondiale chiusero l'età giolittiana."};

/* ============ STATO ============ */
const PEN = 15;
let S = {};
const $ = s => document.querySelector(s);
const main = $("#main");
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9%]/g," ").replace(/\s+/g," ").trim();
const shuffle = a => {a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const totalQ = ROOMS.reduce((n,r)=>n+r.qs.length,0);

function start(){
  main.innerHTML = `
   <div class="kicker">Escape room di storia · Parte 1, Unità 2</div>
   <h1>L'età giolittiana<br>1901–1914</h1>
   <div class="orn">❦ ❦ ❦</div>
   <p>Siete rimasti chiusi nel palazzo del governo. Per uscire dovete attraversare <b>${ROOMS.length} stanze</b>: in ognuna ci sono domande sul capitolo del manuale dedicato a Giolitti.</p>
   <p>Ogni stanza superata vi dà <b>una lettera</b>. Alla fine, con le lettere raccolte, aprirete l'ultima porta.</p>
   <p class="small">Risposta giusta al primo tentativo: 10 punti · al secondo: 5 punti. Ogni errore toglie ${PEN} secondi. Dopo due errori la soluzione viene mostrata e si va avanti: nessuno resta bloccato.</p>
   <div class="row" style="margin:16px 0 4px">
     <label for="team">Nome della squadra:</label>
     <input type="text" id="team" placeholder="es. I Riformisti" style="max-width:260px">
   </div>
   <div class="row" style="margin:10px 0 18px">
     <label for="min">Tempo a disposizione:</label>
     <select id="min"><option>20</option><option selected>25</option><option>30</option><option>35</option></select> minuti
   </div>
   <div class="row right"><button id="go">Entra nel palazzo →</button></div>`;
  $("#go").onclick = () => {
    S = {team:$("#team").value.trim()||"Squadra senza nome", room:0, q:0, tries:0, score:0,
         time:+$("#min").value*60, log:[], letters:[], over:false};
    $("#hud").hidden = false; drawDoors(); tick(); S.int = setInterval(tick,1000);
    roomIntro();
  };
}

function tick(){
  if(S.over) return;
  if(S.started) S.time--; S.started = true;
  if(S.time<=0){S.time=0; renderTime(); return finish(false);}
  renderTime();
}
function renderTime(){
  const m=Math.floor(S.time/60), s=S.time%60, el=$("#timer");
  el.textContent = `${m}:${String(s).padStart(2,"0")}`;
  el.className = "timer"+(S.time<=60?" crit":S.time<=180?" warn":"");
}
function penalty(){
  S.time = Math.max(0,S.time-PEN); renderTime();
  const p=$("#pen"); p.classList.add("show"); setTimeout(()=>p.classList.remove("show"),1100);
  if(S.time<=0) finish(false);
}
function drawDoors(){
  $("#doors").innerHTML = ROOMS.map((r,i)=>`<div class="door ${i<S.room?"open":""} ${i===S.room&&!S.over?"here":""}" title="${esc(r.title)}">${i<S.room?r.letter:i+1}</div>`).join("");
  $("#score").textContent = `Punti: ${S.score}`;
}

function roomIntro(){
  const r = ROOMS[S.room]; drawDoors();
  main.innerHTML = `
   <div class="kicker">Stanza ${S.room+1} di ${ROOMS.length}</div>
   <h2>${r.title}</h2>
   <p class="small"><i>${r.sub}</i></p>
   <div class="orn">❦</div>
   <p>${r.intro}</p>
   <p class="small">${r.qs.length} domande per aprire la porta.</p>
   <div class="row right actions"><button id="go">Comincia →</button></div>`;
  $("#go").onclick = () => {S.q=0; showQ();};
}

function showQ(){
  if(S.over) return;
  const r = ROOMS[S.room], q = r.qs[S.q]; S.tries = 0; S.done=false;
  main.innerHTML = `
   <div class="qmeta"><span>${r.title}</span><span>Domanda ${S.q+1}/${r.qs.length}</span></div>
   <div class="qtext">${esc(q.q)}</div>
   <div id="body"></div>
   <div id="fb"></div>
   <div class="row right actions" id="act"></div>`;
  const body = $("#body"), act = $("#act");
  if(q.t==="mc"){
    q._o = shuffle(q.opts.map((t,i)=>({t,ok:i===q.a})));
    body.innerHTML = `<div class="opts">${q._o.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.t)}</button>`).join("")}</div>`;
    body.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(S.done) return; const o=q._o[+b.dataset.i];
      if(o.ok){b.classList.add("right"); right();}
      else{b.classList.add("wrong"); b.disabled=true; wrong("Quella non è giusta: l'opzione è stata eliminata. Riprova.");}
    });
  }
  if(q.t==="in"){
    body.innerHTML = `<input type="text" id="ans" autocomplete="off" placeholder="Scrivi qui la risposta">`;
    act.innerHTML = `<button id="chk">Verifica</button>`;
    const go=()=>{ if(S.done) return; const v=norm($("#ans").value); if(!v) return;
      if(q.acc.some(a=>norm(a)===v)) right();
      else { const a=q.acc[0]; wrong(`Non ancora. Indizio: la risposta comincia con «${a[0].toUpperCase()}» ed è lunga ${a.length} caratteri.`); $("#ans").select(); } };
    $("#chk").onclick=go; $("#ans").onkeydown=e=>{if(e.key==="Enter")go()}; $("#ans").focus();
  }
  if(q.t==="cls"){
    q._items = shuffle(q.items.map(([t,c])=>({t,c,sel:null})));
    body.innerHTML = `<div class="cls">${q._items.map((it,i)=>`
      <div class="clsrow" id="cr${i}"><span>${esc(it.t)}</span>
      <div class="seg">${q.cats.map((c,j)=>`<button data-i="${i}" data-j="${j}">${esc(c)}</button>`).join("")}</div></div>`).join("")}</div>`;
    body.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{
      if(S.done) return; const i=+b.dataset.i, j=+b.dataset.j; q._items[i].sel=j;
      b.parentNode.querySelectorAll("button").forEach(x=>x.classList.toggle("sel",x===b));
      $("#cr"+i).classList.remove("wrong");
    });
    act.innerHTML = `<button id="chk">Verifica</button>`;
    $("#chk").onclick=()=>{
      if(S.done) return;
      if(q._items.some(it=>it.sel===null)){ fb("Assegna una categoria a ogni voce prima di verificare.","");return;}
      let bad=0; q._items.forEach((it,i)=>{const ok=it.sel===it.c; $("#cr"+i).classList.toggle("right",ok); $("#cr"+i).classList.toggle("wrong",!ok); if(!ok)bad++;});
      if(!bad) right(); else wrong(`${bad} ${bad===1?"voce è sbagliata":"voci sono sbagliate"} (in rosso). Correggi e riprova.`);
    };
  }
  if(q.t==="ord"){
    let cur = shuffle(q.items.map((t,i)=>({t,i})));
    while(q.items.length>1 && cur.every((x,k)=>x.i===k)) cur=shuffle(cur);
    q._cur = cur;
    const draw=()=>{ body.innerHTML = `<div class="ord">${q._cur.map((x,k)=>`
      <div class="orow" id="or${k}"><span class="n">${k+1}</span><span class="t">${esc(x.t)}</span>
      <button data-k="${k}" data-d="-1" ${k===0?"disabled":""} aria-label="Su">▲</button>
      <button data-k="${k}" data-d="1" ${k===q._cur.length-1?"disabled":""} aria-label="Giù">▼</button></div>`).join("")}</div>`;
      body.querySelectorAll(".orow button").forEach(b=>b.onclick=()=>{ if(S.done)return; const k=+b.dataset.k,d=+b.dataset.d;
        [q._cur[k],q._cur[k+d]]=[q._cur[k+d],q._cur[k]]; draw(); }); };
    draw(); q._draw=draw;
    act.innerHTML = `<button id="chk">Verifica</button>`;
    $("#chk").onclick=()=>{
      if(S.done) return; let bad=0;
      q._cur.forEach((x,k)=>{const ok=x.i===k; $("#or"+k).classList.toggle("right",ok); $("#or"+k).classList.toggle("wrong",!ok); if(!ok)bad++;});
      if(!bad) right(); else wrong(`${bad} eventi non sono al posto giusto (in rosso). Spostali e riprova.`);
    };
  }
}

function fb(html,cls){ $("#fb").innerHTML = `<div class="fb ${cls}">${html}</div>`; }
function answerText(q){
  if(q.t==="mc") return q.opts[q.a];
  if(q.t==="in") return q.acc[0][0].toUpperCase()+q.acc[0].slice(1);
  if(q.t==="cls") return q.items.map(([t,c])=>`${t} → ${q.cats[c]}`).join("; ");
  if(q.t==="ord") return q.items.map((t,i)=>`${i+1}. ${t}`).join(" ");
}
function right(){
  const pts = S.tries===0?10:5; S.score+=pts; S.done=true; drawDoors();
  log(pts);
  fb(`<b>Esatto! +${pts} punti.</b><br>${esc(cur().exp)}`,"ok"); next();
}
function wrong(msg){
  S.tries++; penalty(); if(S.over) return;
  if(S.tries>=2){
    S.done=true; log(0); const q=cur();
    if(q.t==="mc") document.querySelectorAll(".opt").forEach(b=>{ if(q._o[+b.dataset.i].ok) b.classList.add("right"); });
    if(q.t==="cls") q._items.forEach((it,i)=>{ const row=$("#cr"+i); row.querySelectorAll("button").forEach((x,j)=>x.classList.toggle("sel",j===it.c)); row.classList.remove("wrong"); row.classList.add("right"); });
    if(q.t==="ord"){ q._cur = q.items.map((t,i)=>({t,i})); q._draw(); document.querySelectorAll(".orow").forEach(r=>r.classList.add("right")); }
    if(q.t==="in"){ $("#ans").value = answerText(q); $("#ans").disabled=true; }
    fb(`<b>Ecco la soluzione.</b> ${esc(answerText(q))}<br>${esc(q.exp)}`,"bad"); next();
  } else fb(msg,"bad");
}
const cur = () => ROOMS[S.room].qs[S.q];
function log(pts){ S.log.push({r:S.room,q:S.q,pts}); }
function next(){
  const act=$("#act"); const last = S.q===ROOMS[S.room].qs.length-1;
  act.innerHTML = `<button id="nx">${last?"Apri la porta →":"Avanti →"}</button>`;
  $("#nx").onclick = () => { if(last) roomDone(); else {S.q++; showQ();} };
  $("#nx").focus();
}
function roomDone(){
  const r = ROOMS[S.room]; S.letters.push(r.letter); S.room++; drawDoors();
  main.innerHTML = `
   <div class="center">
    <div class="kicker">Porta aperta</div>
    <h2>${r.title}: superata!</h2>
    <p>Dietro la porta trovate una lettera incisa nel legno:</p>
    <div class="bigletter">${r.letter}</div>
    <p class="small">Lettere raccolte: <b>${S.letters.join(" · ")}</b></p>
   </div>
   <div class="row right actions"><button id="go">${S.room<ROOMS.length?"Prossima stanza →":"Verso l'ultima porta →"}</button></div>`;
  $("#go").onclick = () => S.room<ROOMS.length ? roomIntro() : finalLock();
}
function finalLock(){
  S.ftries=0;
  main.innerHTML = `
   <div class="kicker">L'ultima porta</div>
   <h2>Il lucchetto finale</h2>
   <div class="tiles">${S.letters.map(l=>`<div class="tile">${l}</div>`).join("")}</div>
   <p class="qtext">${esc(FINAL.q)}</p>
   <input type="text" id="ans" autocomplete="off" placeholder="Cognome">
   <div id="fb"></div>
   <div class="row right actions" id="act"><button id="chk">Apri</button></div>`;
  const go=()=>{ const v=norm($("#ans").value); if(!v) return;
    if(FINAL.answer.some(a=>norm(a)===v)){ S.score+=20; finish(true); }
    else { S.ftries++; penalty(); if(S.over) return;
      fb(S.ftries>=2?"Indizio: l'ultima pagina del capitolo, «1914: finisce l'età giolittiana». Il nome di battesimo è Antonio.":"Il lucchetto non si apre. Prova un altro ordine delle lettere.","bad"); } };
  $("#chk").onclick=go; $("#ans").onkeydown=e=>{if(e.key==="Enter")go()}; $("#ans").focus();
}

function finish(won){
  if(S.over) return; S.over=true; clearInterval(S.int); drawDoors();
  const max = totalQ*10+20;
  const m=Math.floor(S.time/60), s=S.time%60;
  const byRoom = ROOMS.map((r,ri)=>{
    const qs = r.qs.map((q,qi)=>{ const l=S.log.find(x=>x.r===ri&&x.q===qi);
      const tag = !l?`<span class="tag t0">non svolta</span>`:`<span class="tag t${l.pts}">${l.pts} pt</span>`;
      return `<div class="rq">${esc(q.q)} ${tag}<br><span class="a">${esc(answerText(q))}</span><br><span class="small">${esc(q.exp)}</span></div>`; }).join("");
    return `<details><summary>Stanza ${ri+1}: ${r.title}</summary>${qs}</details>`; }).join("");
  main.innerHTML = `
   <div class="center">
    <div class="kicker">${esc(S.team)}</div>
    <h1>${won?"Siete usciti!":"Tempo scaduto"}</h1>
    ${won?`<p>Avete aperto l'ultima porta con <b>${m}:${String(s).padStart(2,"0")}</b> ancora sul timer.</p><div class="bigletter" style="width:auto;padding:0 20px;font-size:2.4rem">SALANDRA</div><p class="small">${esc(FINAL.exp)}</p>`
         :`<p>Siete arrivati alla stanza ${Math.min(S.room+1,ROOMS.length)} di ${ROOMS.length}. Non importa: qui sotto trovate tutte le soluzioni per ripassare.</p>`}
    <h2 style="margin-top:14px">${S.score} / ${max} punti</h2>
    <p class="small">Domande svolte: ${S.log.length} su ${totalQ} · al primo colpo: ${S.log.filter(x=>x.pts===10).length}</p>
   </div>
   <div class="review"><h3>Ripasso: tutte le risposte</h3>${byRoom}</div>
   <div class="row right actions"><button class="ghost" id="again">Ricomincia</button></div>`;
  $("#again").onclick = () => { $("#hud").hidden=true; start(); };
}
start();
</script>
</body>
</html>
